; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
platform = espressif32@6.3.2
board = seeed_xiao_esp32s3
framework = arduino
lib_deps =
	olikraus/U8g2@^2.35.8
	adafruit/Adafruit NeoPixel@^1.12.0
	madhephaestus/ESP32Servo
	waspinator/AccelStepper@^1.64
	adafruit/Adafruit_VL53L0X
	adafruit/Adafruit SSD1306
	adafruit/Adafruit GFX Library
	fluxgarage/FluxGarage RoboEyes@^1.1.1

[env:seeed_xiao_esp32s3]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
build_flags =
	-std=gnu++17
lib_deps = ${common.lib_deps}

[env:seeed_xiao_esp32s3_ota_init]
; 1er flash en USB pour bootstrapper l'OTA
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
build_flags =
	-std=gnu++17
	-DOTA_ENABLED
lib_deps = ${common.lib_deps}

[env:seeed_xiao_esp32s3_ota]
; Flash suivants via WiFi — mettre l'IP du robot dans upload_port
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
upload_protocol = espota
upload_port = 192.168.1.47
upload_flags = --auth=pami2026
extra_scripts = pre:scripts/ota_upload.py
build_flags =
	-std=gnu++17
	-DOTA_ENABLED
lib_deps = ${common.lib_deps}
